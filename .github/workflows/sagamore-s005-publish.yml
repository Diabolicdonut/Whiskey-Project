name: Sagamore S005 guarded three-expression release
on:
  push:
    branches: [main]
    paths:
      - research/SAGAMORE-S005-RELEASE-REQUEST.md
permissions:
  contents: write
concurrency:
  group: old-oak-sagamore-s005
  cancel-in-progress: false
jobs:
  publish:
    name: S005 historical Rum, Rye Ale and Vintner releases
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove R008 and S004 accepted; no replay
        run: python scripts/sagamore_s005_release.py preflight
      - name: Install pinned static and Chromium tools
        run: |
          python -m pip install html5lib==1.1 Pillow==11.3.0 lxml==6.0.1
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage precisely three new dossiers, metadata, index and filters
        env:
          OLD_OAK_RESEARCH_DATE: '2026-10-28'
        run: python scripts/sagamore_s005_release.py stage
      - name: Validate all 1062 HTML dossiers and original index/hash preservation
        run: python scripts/north_american_validate.py --full
      - name: Validate 714 responsive 390 768 and 1440 Chromium cases
        run: node scripts/north_american_runtime.cjs --focused
      - name: Accept evidence and align R008 roadmap, ledger and homepage
        run: |
          set -euo pipefail
          python scripts/sagamore_s005_release.py finalize
          python scripts/sagamore_discovery_validate.py
          python scripts/roadmap_validate.py
          python scripts/north_american_validate.py --full
      - name: Commit only 9 authorized publication files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html sagamore-expansion-data.json sagamore-expression-ledger.json \
            DEVELOPMENT-ROADMAP.md site-progress.json AGENTS.md \
            sagamore-rum-cask-finish.html sagamore-rye-ale-finish.html \
            sagamore-vintners-finish.html
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git diff --cached --check
          git commit -m 'Sagamore S005: accept three historical finishes and roadmap R008'
          git push origin HEAD:main
      - name: Preserve validation evidence
        if: always()
        run: |
          mkdir -p .sagamore-s005-report
          if [ -f ../expansion-research/static-report.json ]; then cp ../expansion-research/static-report.json .sagamore-s005-report/; fi
          if [ -f ../expansion-research/runtime-output/runtime-report.json ]; then cp ../expansion-research/runtime-output/runtime-report.json .sagamore-s005-report/; fi
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-oak-sagamore-s005-validation
          path: .sagamore-s005-report/
          retention-days: 30
