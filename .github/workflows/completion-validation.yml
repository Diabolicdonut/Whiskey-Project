name: Old Oak completion validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: old-oak-completion-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation tools
        run: |
          python -m pip install html5lib==1.1 Pillow==11.3.0 lxml==6.0.1
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify authoritative development roadmap and homepage status
        run: python scripts/roadmap_validate.py
      - name: Static repository validation
        id: static
        continue-on-error: true
        run: |
          if [ -f north-american-expansion-data.json ]; then
            python scripts/north_american_validate.py
          else
            python scripts/completion_validate.py validate
          fi
      - name: Runtime and responsive validation
        id: runtime
        continue-on-error: true
        run: |
          if [ -f north-american-expansion-data.json ]; then
            node scripts/north_american_runtime.cjs --focused
          else
            node scripts/completion_runtime.cjs
          fi
      - name: Collect expansion validation reports
        if: always()
        run: |
          mkdir -p .completion-output
          if [ -f ../expansion-research/static-report.json ]; then
            cp ../expansion-research/static-report.json .completion-output/expansion-static-report.json
          fi
          if [ -f ../expansion-research/runtime-output/runtime-report.json ]; then
            cp ../expansion-research/runtime-output/runtime-report.json .completion-output/expansion-runtime-report.json
          fi
      - name: Publish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-oak-validation-${{ github.sha }}
          path: .completion-output/
          retention-days: 30
          include-hidden-files: true
      - name: Require both validation passes
        if: always()
        env:
          STATIC_RESULT: ${{ steps.static.outcome }}
          RUNTIME_RESULT: ${{ steps.runtime.outcome }}
        run: |
          test "$STATIC_RESULT" = success
          test "$RUNTIME_RESULT" = success
